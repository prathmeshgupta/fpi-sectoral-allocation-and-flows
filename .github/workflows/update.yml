name: Fortnightly FPI Sectoral Flows Dataset Update

on:
  schedule:
    # Runs every other Sunday at 21:00 UTC (02:30 IST Monday)
    - cron: '0 21 1,16 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update FPI Sectoral Flows data
        run: |
          python update.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --staged --quiet; then
            echo "No changes in FPI sectoral flows."
          else
            git commit -m "chore(data): automated fortnightly FPI sectoral update [skip ci]"
            git push
          fi
